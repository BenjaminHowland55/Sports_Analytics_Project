<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>{% block title %}Home{% endblock %} | Rebuilding the Red Wall</title>
  <link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}">
</head>
<body>
  {% set nav_items = [
    ("home", "Home"),
    ("stats", "Stats"),
    ("analysis", "Analysis"),
    ("visualizations", "Visualizations"),
    ("source", "Source"),
  ] %}
  <header class="site-header">
    <div class="header-top">
      <a class="site-title" href="{{ url_for('home') }}">Rebuilding the Red Wall</a>
    </div>
    <nav class="header-nav" aria-label="Main">
      {% for endpoint, label in nav_items %}
      <a href="{{ url_for(endpoint) }}"{% if request.endpoint == endpoint %} class="active" aria-current="page"{% endif %}>{{ label }}</a>
      {% endfor %}
    </nav>
  </header>
  <main>
    {% block content %}{% endblock %}
  </main>
</body>
</html>
